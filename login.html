<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StoryVerse</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#111827;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .card{
            width:350px;
            background:#1f2937;
            padding:30px;
            border-radius:10px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            cursor:pointer;
        }

        #message{
            margin-top:15px;
            color:#4ade80;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>StoryVerse Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button id="signupBtn">Sign Up</button>

    <br><br>

    <button id="loginBtn">Login</button>

    <p id="message"></p>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
